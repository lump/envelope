# Filled in by Maven at build time; see the resource filtering in pom.xml.
# Do not edit the values here.  The version comes from .Major.version,
# .Minor.version and .Patch.version at the top of the tree, which are the single
# source of truth for it and are also what build.sh tags the image with.  The
# provenance is recorded only when the build is passed -Denvelope.commit and
# friends.
version=${envelope.major}.${envelope.minor}.${envelope.patch}
major=${envelope.major}
minor=${envelope.minor}
patch=${envelope.patch}
built=${maven.build.timestamp}
commit=${envelope.commit}
branch=${envelope.branch}
committer=${envelope.committer}
committed=${envelope.committed}
