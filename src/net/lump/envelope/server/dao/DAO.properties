
# Defaults only.  Any key here can be overridden at runtime by a system property
# (-DDAO.hibernate.connection.url=...) or an environment variable
# (DAO_HIBERNATE_CONNECTION_URL=...); see ServerPrefs.lookupOverride.
# The docker-compose stack sets these via the environment.

# "db" is the compose service name; override for a database elsewhere.
hibernate.dialect=org.hibernate.dialect.MariaDB106Dialect
hibernate.connection.driver_class=org.mariadb.jdbc.Driver
hibernate.connection.url=jdbc:mariadb://db:3306/envelope

#hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
#hibernate.connection.driver_class=org.postgresql.Driver
#hibernate.connection.url=jdbc:postgresql://db:5432/envelope

hibernate.connection.username=budget
hibernate.connection.password=tegdub
hibernate.format_sql=true
hibernate.show_sql=false
hibernate.use_sql_comments=true

hibernate.jdbc.fetch_size=16
hibernate.jdbc.batch_size=0
hibernate.jdbc.batch_versioned_data=true

# HikariCP replaces c3p0.  Hibernate 5 reads hibernate.hikari.* and hands the rest
# straight to HikariConfig.
hibernate.connection.provider_class=org.hibernate.hikaricp.internal.HikariCPConnectionProvider
hibernate.hikari.maximumPoolSize=32
hibernate.hikari.minimumIdle=1
hibernate.hikari.idleTimeout=300000
hibernate.hikari.connectionTimeout=30000
hibernate.hikari.poolName=envelope

# The second-level cache is off.  It used to run on ehcache 2's Hibernate
# integration, which was never republished for jakarta.persistence and has no
# drop-in equivalent; re-enable with hibernate-jcache + ehcache 3 if it is wanted.
hibernate.cache.use_second_level_cache=false
hibernate.cache.use_query_cache=false

hibernate.current_session_context_class=thread
hibernate.generate_statistics=false
