# log4j configuration
#
# Log Levels:
# ALL, TRACE, DEBUG, INFO, WARN, ERROR, and FATAL
#

# Set root logger level to INFO and name its appenders console, syslog.
log4j.rootLogger=INFO, file, console

# net.lump
log4j.logger.net.lump=DEBUG

# c3p0
#log4j.logger.com.mchange.v2.c3p0=WARN

# ehcache
#log4j.logger.net.sf.ehcache=INFO

# hibernate
log4j.logger.org.hibernate=INFO

### Every statement, in full.  This was left at DEBUG, and with
### hibernate.format_sql=true each statement is pretty-printed over its own block
### of lines -- one criteria query for a single user ran to 21 log lines, so
### ordinary use buried everything else and the rolling file turned over quickly.
### org.hibernate.SQL only ever logs at DEBUG and below, so INFO silences it;
### put it back to DEBUG when you actually need to see the SQL.
log4j.logger.org.hibernate.SQL=INFO

### log HQL query parser activity
#log4j.logger.org.hibernate.hql.ast.AST=DEBUG
### log JDBC bind parameters -- DEBUG here fills in the ? in the statements above
#log4j.logger.org.hibernate.type.descriptor.sql=DEBUG
### log schema export/update ###
#log4j.logger.org.hibernate.tool.hbm2ddl=INFO
### log HQL parse trees
#log4j.logger.org.hibernate.hql=INFO

### Cache activity, for a second-level cache that is switched off
### (hibernate.cache.use_second_level_cache=false), so DEBUG here only ever
### announced the no-op region factory at startup.
log4j.logger.org.hibernate.cache=INFO

### Transaction activity.  Hibernate 5 moved this to
### org.hibernate.resource.transaction, so the old name had stopped matching
### anything anyway; DAO logs its own begin/commit under net.lump.
log4j.logger.org.hibernate.transaction=INFO

### HHH90000022, "legacy org.hibernate.Criteria API is deprecated", once per
### criteria query -- and every query this application makes is one.  It is not
### advice anyone can take: DetachedCriteria is serialized across the wire as part
### of the RPC protocol, which is why we are pinned to Hibernate 5.6 at all, and
### moving off it means redesigning the protocol rather than swapping an API.  A
### warning that repeats forever and cannot be acted on only trains people to
### ignore warnings, so it is off.  Turn it back on if that redesign ever starts.
log4j.logger.org.hibernate.orm.deprecation=ERROR
### log JDBC resource acquisition
#log4j.logger.org.hibernate.jdbc=INFO
### enable the following line if you want to track down connection ###
### leakages when using DriverManagerConnectionProvider ###
#log4j.logger.org.hibernate.connection.DriverManagerConnectionProvider=INFO
#log4j.logger.org.hibernate.connection.DriverManagerConnectionProvider=FATAL

log4j.category.stdout=INFO
log4j.category.stderr=ERROR

log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=${catalina.home}/logs/envelope.log
log4j.appender.file.MaxFileSize=5MB
log4j.appender.file.MaxBackupIndex=5
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d [%t] %p %c{3} %m%n

# console appender -- container stdout
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d [%t] %p %c{2} %m%n
log4j.appender.console.Target=System.out

# syslog appender
#log4j.appender.syslog=org.apache.log4j.net.SyslogAppender
#log4j.appender.syslog.syslogHost=localhost
#log4j.appender.syslog.Facility=daemon
#log4j.appender.syslog.layout=org.apache.log4j.PatternLayout
