# Envelope server: Tomcat, containerised.  The database is not.
#
#   cd docker && docker compose up -d
#
# The war is built by `mvn package` into ../target/envelope.war and bind-mounted
# into Tomcat's webapps, so a rebuild plus `docker compose restart tomcat` picks
# up new code without rebuilding an image.
#
# The database is the native MariaDB on the host, which is where the migrated
# budget lives.  It is reached at tiamat.lump:3306 -- and note that name resolves
# differently depending on where you ask it: from inside a container it is the
# host's LAN address, while on the host itself it is 127.0.1.1.  So reaching it
# from a host shell says nothing about whether the container can; check from
# inside a container.
#
# The schema lives in ../sql: load bootstrap-mysql.sql into a fresh database and
# apply anything in ../sql/migrations to an existing one.  There used to be a
# containerised MariaDB here that did that on first start; it was removed once
# the data moved to the host.  Its data volume is not declared any more and so is
# no longer managed by compose -- `docker volume ls` will still show
# envelope_db-data until it is removed by hand.
#
# The Swing client runs on the host and talks to http://localhost:7041/envelope/.

name: envelope

services:

  tomcat:
    image: tomcat:11.0-jdk25-temurin
    container_name: envelope-tomcat
    restart: unless-stopped
    environment:
      # ServerPrefs turns these into hibernate settings; see DAO.properties.
      # DB_URL overrides the whole JDBC url, for pointing at a different server.
      DAO_HIBERNATE_CONNECTION_URL: ${DB_URL:-jdbc:mariadb://tiamat.lump:3306/envelope}
      DAO_HIBERNATE_CONNECTION_USERNAME: ${DB_USER:-budget}
      DAO_HIBERNATE_CONNECTION_PASSWORD: ${DB_PASSWORD:-tegdub}
      SERVERPREFS_CONFIGURE_USERNAME: ${ADMIN_USER:-admin}
      SERVERPREFS_CONFIGURE_PASSWORD: ${ADMIN_PASSWORD:-envelope}
      # marks both config sections complete, so the server does not hold every
      # request at the /configure form waiting for a human to submit it
      DAO_OK: ok
      SERVERPREFS_OK: ok
      # log4j1.compatibility lets log4j-1.2-api read the existing
      # WEB-INF/classes/log4j.properties instead of needing a log4j2 config
      CATALINA_OPTS: >-
        -Xmx512m -Djava.awt.headless=true
        -Dlog4j1.compatibility=true
        -Dlog4j.configuration=log4j.properties
    ports:
      # 7041 is the port ServerSettings defaults to on the client
      - "127.0.0.1:7041:8080"
    volumes:
      - ../target/envelope.war:/usr/local/tomcat/webapps/envelope.war:ro
    healthcheck:
      # readiness (database reachable), not just liveness; the temurin image has
      # bash but no curl/wget/nc, so probe via /dev/tcp
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /envelope/info/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"^ready:\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
