# Envelope server stack: MariaDB + Tomcat, both containerised.
#
#   cd docker && docker compose up -d
#
# The war is built by `mvn package` into ../target/envelope.war and bind-mounted
# into Tomcat's webapps, so a rebuild plus `docker compose restart tomcat` picks
# up new code without rebuilding an image.
#
# The Swing client runs on the host and talks to http://localhost:7041/envelope/.

name: envelope

services:

  db:
    image: mariadb:11.8
    container_name: envelope-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpw}
      MARIADB_USER: ${DB_USER:-budget}
      MARIADB_PASSWORD: ${DB_PASSWORD:-tegdub}
    ports:
      # exposed on a non-default port so it cannot collide with a host mysqld
      - "127.0.0.1:13306:3306"
    volumes:
      - db-data:/var/lib/mysql
      # anything in here runs once, on first init of an empty data volume
      - ./initdb:/docker-entrypoint-initdb.d:ro
      # the authoritative schema, sourced by initdb/01-bootstrap.sh
      - ../sql:/sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  tomcat:
    image: tomcat:11.0-jdk25-temurin
    container_name: envelope-tomcat
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ServerPrefs turns these into hibernate settings; see DAO.properties.
      #
      # This points at the *native* MariaDB on the host, not the db service below,
      # because that is where the migrated budget lives.  Note that tiamat.lump
      # resolves differently depending on where you ask: from inside a container it
      # is the host's LAN address (172.17.2.245), while on the host itself it is
      # 127.0.1.1 -- so testing this from a host shell proves nothing about whether
      # the container can reach it.
      #
      # Set DB_URL to point back at the containerised database:
      #   DB_URL=jdbc:mariadb://db:3306/envelope docker compose up -d
      DAO_HIBERNATE_CONNECTION_URL: ${DB_URL:-jdbc:mariadb://tiamat.lump:3306/envelope}
      DAO_HIBERNATE_CONNECTION_USERNAME: ${DB_USER:-budget}
      DAO_HIBERNATE_CONNECTION_PASSWORD: ${DB_PASSWORD:-tegdub}
      SERVERPREFS_CONFIGURE_USERNAME: ${ADMIN_USER:-admin}
      SERVERPREFS_CONFIGURE_PASSWORD: ${ADMIN_PASSWORD:-envelope}
      # marks both config sections complete, so the server does not hold every
      # request at the /configure form waiting for a human to submit it
      DAO_OK: ok
      SERVERPREFS_OK: ok
      # log4j1.compatibility lets log4j-1.2-api read the existing
      # WEB-INF/classes/log4j.properties instead of needing a log4j2 config
      CATALINA_OPTS: >-
        -Xmx512m -Djava.awt.headless=true
        -Dlog4j1.compatibility=true
        -Dlog4j.configuration=log4j.properties
    ports:
      # 7041 is the port ServerSettings defaults to on the client
      - "127.0.0.1:7041:8080"
    volumes:
      - ../target/envelope.war:/usr/local/tomcat/webapps/envelope.war:ro
    healthcheck:
      # the temurin image has bash but no curl/wget/nc, so probe via /dev/tcp
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /envelope/info/ping HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q pong <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  db-data:
